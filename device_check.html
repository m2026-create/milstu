<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교실 기기 점검</title>
<style>
:root{
  --pp:#7C4DFF; --pp-d:#6336E0; --pp-l:#EFE9FF; --pp-xl:#F8F5FF;
  --or:#FF9F43; --or-l:#FFF1E2; --bl:#4A9BFF; --bl-l:#E6F1FF;
  --gr:#22C07D; --gr-l:#E3F8EF; --rd:#F2614F; --rd-l:#FDECE9;
  --yl:#FFC53D; --yl-l:#FFF6DF;
  --ink:#2A2440; --sub:#7A7591; --line:#ECE8F6;
  --r:24px; --r2:18px; --r3:12px;
  --sh:0 8px 26px rgba(95,70,180,.10), 0 2px 6px rgba(95,70,180,.05);
  --sh2:0 16px 40px rgba(95,70,180,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{min-height:100vh;color:var(--ink);font-size:15px;line-height:1.6;
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:linear-gradient(180deg,#F7F4FF 0%,#FDFCFF 38%,#FFFFFF 100%);
  position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none}
body::before{width:440px;height:440px;background:rgba(150,110,255,.18);top:-170px;left:-140px}
body::after{width:380px;height:380px;background:rgba(255,190,100,.18);bottom:-150px;right:-120px}

header.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hbar{max-width:1060px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px}
.hbar .mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(145deg,#9B6BFF,#6336E0);box-shadow:0 6px 16px rgba(99,54,224,.32);flex:0 0 auto}
.hbar b{font-size:16px;letter-spacing:-.3px;display:block;line-height:1.25}
.hbar small{font-size:11.5px;color:var(--sub)}
.hbar .sp{flex:1}

.wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:26px 18px 60px}
.narrow{max-width:540px}
h1{font-size:27px;margin:0 0 6px;letter-spacing:-.7px;line-height:1.3}
h1 .c1{color:var(--pp)} h1 .c2{color:var(--or)}
.lead{color:var(--sub);font-size:14.5px;margin:0 0 22px}
h2{font-size:17px;margin:0 0 14px;display:flex;align-items:center;gap:9px}
.pill{background:linear-gradient(145deg,#9B6BFF,var(--pp-d));color:#fff;border-radius:99px;
  font-size:11.5px;padding:3px 10px;font-weight:700;flex:0 0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:22px;margin-bottom:18px;animation:up .45s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.btn{font:inherit;font-size:15px;font-weight:700;color:#fff;cursor:pointer;border:none;border-radius:99px;
  padding:13px 22px;background:linear-gradient(145deg,#9B6BFF,var(--pp-d));
  box-shadow:0 7px 18px rgba(99,54,224,.3);transition:.18s cubic-bezier(.2,.8,.3,1);
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 13px 26px rgba(99,54,224,.4)}
.btn:active:not(:disabled){transform:none}
.btn:disabled{opacity:.42;cursor:default;box-shadow:none}
.btn.ghost{background:#fff;color:var(--pp-d);border:1.6px solid var(--pp-l);box-shadow:0 4px 12px rgba(99,54,224,.08)}
.btn.ghost:hover:not(:disabled){border-color:var(--pp);box-shadow:0 10px 20px rgba(99,54,224,.15)}
.btn.warm{background:linear-gradient(145deg,#FFC178,#FF9F43);color:#6B3A00;box-shadow:0 7px 18px rgba(255,159,67,.3)}
.btn.sm{font-size:13.5px;padding:9px 16px}
.btn.block{width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

label.fld{display:block;font-size:12.5px;color:var(--sub);margin:0 0 5px;font-weight:600}
input[type=text],input[type=number],select{font:inherit;padding:11px 14px;border:1.6px solid var(--line);
  border-radius:var(--r2);background:#FCFBFF;transition:.15s;width:100%}
input:focus,select:focus{outline:none;border-color:var(--pp);background:#fff;box-shadow:0 0 0 4px rgba(124,77,255,.1)}
input[type=range]{width:100%;accent-color:var(--pp)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--pp)}

.note{font-size:12.5px;color:var(--sub);line-height:1.7}
.alert{border-radius:var(--r2);padding:12px 15px;font-size:13.5px;line-height:1.65;margin-top:13px}
.alert.err{background:var(--rd-l);color:#B23A28}
.alert.ok{background:var(--gr-l);color:#17804F}
.alert.info{background:var(--pp-xl);color:var(--pp-d)}
.alert.warn{background:var(--yl-l);color:#8A6200}
.hidden{display:none !important}

.scroll{overflow:auto;border-radius:var(--r2);border:1px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{background:var(--pp-xl);font-weight:700;position:sticky;top:0;z-index:2}
tbody th{background:#fff;position:sticky;left:0;text-align:left;font-weight:700;z-index:1}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:none}
td.diag{background:var(--gr-l);font-weight:800;color:var(--gr)}
td.miss{background:var(--rd-l);color:var(--rd);font-weight:700}
td.zero{color:#C3CAD8}
tr.reco{background:var(--yl-l)}
tr.reco td,tr.reco th{font-weight:800}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:700}
.tag.g{background:var(--gr-l);color:#17804F} .tag.y{background:var(--yl-l);color:#8A6200}
.tag.p{background:var(--pp-l);color:var(--pp-d)} .tag.r{background:var(--rd-l);color:#B23A28}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:15px 17px;box-shadow:var(--sh)}
.tile b{display:block;font-size:27px;line-height:1.15;letter-spacing:-1px}
.tile span{font-size:12.5px;color:var(--sub)}
.tile.good b{color:var(--gr)} .tile.bad b{color:var(--rd)} .tile.hold b{color:#C98A1E}

.loader{width:34px;height:34px;border:3.5px solid var(--pp-l);border-top-color:var(--pp);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:9px;background:#EFEAFA;border-radius:99px;overflow:hidden;margin:13px 0 5px}
.bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--pp),#9B6BFF);transition:width .2s}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:13px}
.gcard{background:#fff;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;
  box-shadow:var(--sh);transition:.2s}
.gcard:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.gcard img{width:100%;aspect-ratio:1;object-fit:contain;background:#F5F3FC;display:block}
.gmeta{padding:9px 11px;font-size:12.5px;line-height:1.65;text-align:left}
.gmeta .t{color:var(--sub);word-break:break-all}
.gmeta .a{color:var(--gr);font-weight:700}
.gmeta .p{color:var(--rd);font-weight:700}
.gmeta .pr{color:var(--sub);font-size:11.5px}

.checks{display:grid;gap:10px}
.ck{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;
  border:1.5px solid var(--line);border-radius:var(--r2);padding:13px 16px;background:#FCFBFF}
.ck.ok{border-color:#B9EBD4;background:#F6FEFA}
.ck.no{border-color:#F6C9C1;background:#FFF8F7}
.ck.warn{border-color:#F8E3AE;background:#FFFCF3}
.ck .ic{font-size:19px;line-height:1.3}
.ck b{display:block;font-size:14.5px;margin-bottom:2px}
.ck .d{font-size:12.5px;color:var(--sub);line-height:1.65;word-break:break-all}
.ck .v{font-size:12.5px;font-weight:700;white-space:nowrap}
.ck.ok .v{color:#17804F} .ck.no .v{color:#B23A28} .ck.warn .v{color:#8A6200}
#dvWrap{position:relative;border-radius:var(--r2);overflow:hidden;background:#231d38;margin-top:14px}
#dvVideo{width:100%;display:block;max-height:46vh;object-fit:cover}
#dvShot{width:100%;border-radius:var(--r2);display:block;margin-top:12px;border:1px solid var(--line)}
</style>
</head>
<body>
<header class="top"><div class="hbar">
  <div class="mark">🩺</div>
  <div><b>교실 기기 점검</b><small>우유왕 출석 · 선생님 도구</small></div>
  <div class="sp"></div>
  <button class="btn ghost sm" onclick="location.href='tools.html'">← 도구 모음</button>
</div></header>

<div class="wrap narrow">
  <h1>🩺 교실 기기 점검</h1>
  <p class="lead">학생이 쓸 기기에서 이 주소를 열고, 아래 항목을 확인한 뒤 결과를 기록해 두세요.</p>

  <section class="card">
    <h2><span class="pill">1</span> 자동으로 확인한 것</h2>
    <div class="checks" id="checks"></div>
    <button class="btn ghost block sm" id="btnRe" style="margin-top:14px">다시 확인</button>
  </section>

  <section class="card">
    <h2><span class="pill">2</span> 카메라 직접 켜 보기</h2>
    <div class="row">
      <button class="btn" id="btnBack" style="flex:1">📷 뒤 카메라</button>
      <button class="btn ghost" id="btnFront" style="flex:1">🤳 앞 카메라</button>
    </div>
    <div id="dvWrap" class="hidden"><video id="dvVideo" playsinline webkit-playsinline muted autoplay></video></div>
    <div class="row" style="margin-top:12px">
      <button class="btn warm" id="btnSnap" disabled style="flex:1">📸 한 장 찍기</button>
      <button class="btn ghost" id="btnStop" disabled>끄기</button>
    </div>
    <img id="dvShot" class="hidden" alt="">
    <div id="camMsg"></div>
  </section>

  <section class="card">
    <h2><span class="pill">3</span> 결과 복사</h2>
    <p class="note" style="margin-bottom:13px">기기 종류마다 한 번씩 눌러 기록해 두세요.</p>
    <button class="btn block" id="btnCopy">📋 결과 복사</button>
    <div id="copyMsg"></div>
    <div class="scroll" style="margin-top:14px"><table id="tbl"></table></div>
  </section>
</div>

<!-- 티처블 머신이 준 script 태그. 버전을 바꾸지 않는다. -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>

/* =====================================================================
   공통 부분 — 일곱 화면이 똑같이 쓰는 함수들
   · 사진은 브라우저 밖으로 나가지 않는다. 저장도, 로그인도 하지 않는다.
   · model.json / metadata.json / weights.bin 은 이 파일과 같은 폴더에 둔다.
   ===================================================================== */
const MODEL_URL = "./";   // 전역 URL 객체를 가리지 않도록 이름을 따로 쓴다
const OUT = 224;          // 티처블 머신 입력 한 변의 길이
const $ = (id) => document.getElementById(id);

function esc(s){ return String(s).replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m])); }
function msg(host, text, kind){ $(host).innerHTML = '<div class="alert '+(kind||"info")+'">'+text+'</div>'; }
function clearMsg(host){ $(host).innerHTML = ""; }

/* ── 모델 불러오기 ───────────────────────────────────────────────
   한 번만 읽어 두고 다시 쓴다. 실패하면 까닭을 그대로 올려 보낸다. */
let __model = null, __labels = [];
async function loadModel(){
  if(__model) return __model;
  if(typeof tmImage === "undefined")
    throw new Error("티처블 머신 스크립트를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
  __model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
  __labels = (typeof __model.getClassLabels === "function") ? __model.getClassLabels() : [];
  return __model;
}
function modelLabels(){ return __labels.slice(); }

/* 모델을 못 읽었을 때 늘 같은 안내를 보여 준다 */
function modelErrorHtml(e){
  let why;
  if(typeof tmImage === "undefined")
    why = '티처블 머신 라이브러리를 받지 못했습니다. 인터넷 연결이나 학교 방화벽(cdn.jsdelivr.net)을 확인해 주세요.';
  else if(location.protocol === "file:")
    why = '파일을 더블클릭으로 열면 브라우저가 model.json 읽기를 막습니다. 배포 주소로 열어 주세요.';
  else
    why = '같은 폴더에서 model.json · metadata.json · weights.bin 을 찾지 못했습니다. 세 파일이 이 화면과 같은 자리에 있는지 확인해 주세요.';
  return '<b>모델을 불러오지 못했습니다.</b><br>' + why +
    '<br><span style="opacity:.75">(' + esc(e.message || e) + ')</span>';
}

/* ── 흰 정사각형에 비율을 지켜 담기 ─────────────────────────────── */
function fitSquare(src, sx, sy, sw, sh, outCanvas, size){
  const n = size || OUT;
  const out = outCanvas || document.createElement("canvas");
  out.width = out.height = n;
  const ctx = out.getContext("2d", {willReadFrequently:true});
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,n,n);
  const k = Math.min(n/sw, n/sh), dw = sw*k, dh = sh*k;
  ctx.drawImage(src, sx, sy, sw, sh, (n-dw)/2, (n-dh)/2, dw, dh);
  out.__rect = {x:(n-dw)/2, y:(n-dh)/2, w:dw, h:dh};   // 흰 여백을 뺀 실제 사진 자리
  return out;
}


/* =====================================================================
   흑백 이진화 (bin-v2) — 글씨 획만 검정, 나머지는 모두 흰색
   우유갑의 어두운 바탕, 얼룩, 그림자, 색 인쇄처럼 '글씨가 아닌데 어두운 것'은
   흰색으로 보낸다.
     ① 회색조 + 색의 진하기(채도) 구하기
     ② 바탕 밝기 구하기: 최댓값 → 최솟값 필터(닫힘)로 가는 획만 지우고 살짝 흐리기
     ③ 바탕으로 나눠 조명 기울기와 그림자를 평평하게 펴기
     ④ 오츠(Otsu) 방법으로 '주변보다 어두운 곳'의 기준을 찾고,
        이력 문턱(hysteresis): 충분히 진한 점에서 시작해 이어진 획만 남긴다
        → 옅은 얼룩·연한 회색 자국은 시작점이 없어 사라진다
     ⑤ 아주 어두운 곳 가운데 두꺼운 덩어리(우유갑 진한 면, 짙은 무늬)는 둘레까지 지우고,
        가는 것(굵은 펜 글씨의 속)은 획으로 채운다
     ⑥ 덩어리 검사: 너무 두꺼운 것, 속이 꽉 찬 큰 덩어리, 가장자리의 굵은 띠와
        곧은 선, 아주 작은 티끌은 글씨가 아니므로 흰색
   · 글씨가 남지 않으면 통째로 흰 그림 (빈 칸, '없음' 클래스용 사진).
   · 이미 흑백인 그림은 ⑥ 덩어리 검사만 한다. 두 번 거쳐도 그림이 같다.
   · 브라우저의 canvas filter 를 쓰지 않고 모두 숫자로 계산한다.
     크롬·삼성 인터넷·사파리 어디서든 같은 사진이면 같은 흑백 그림이 나온다.
   · 캔버스 크기에 맞춰 필터 크기를 정하므로 224·128·300 모두 쓸 수 있다.
   ===================================================================== */
const BIN_VERSION = "bin-v2";

/* 한 줄씩 최댓값 필터 (획 지우기) */
function __binMax1D(src, dst, w, h, r, horiz){
  if(horiz){
    for(let y=0;y<h;y++){
      const row=y*w;
      for(let x=0;x<w;x++){
        let m=0; const a=Math.max(0,x-r), b=Math.min(w-1,x+r);
        for(let k=a;k<=b;k++){ const v=src[row+k]; if(v>m) m=v; }
        dst[row+x]=m;
      }
    }
  }else{
    for(let x=0;x<w;x++){
      for(let y=0;y<h;y++){
        let m=0; const a=Math.max(0,y-r), b=Math.min(h-1,y+r);
        for(let k=a;k<=b;k++){ const v=src[k*w+x]; if(v>m) m=v; }
        dst[y*w+x]=m;
      }
    }
  }
}

/* 한 줄씩 최솟값 필터 (최댓값 필터와 짝: 큰 어두운 면의 경계를 제자리로) */
function __binMin1D(src, dst, w, h, r, horiz){
  if(horiz){
    for(let y=0;y<h;y++){
      const row=y*w;
      for(let x=0;x<w;x++){
        let m=255; const a=Math.max(0,x-r), b=Math.min(w-1,x+r);
        for(let k=a;k<=b;k++){ const v=src[row+k]; if(v<m) m=v; }
        dst[row+x]=m;
      }
    }
  }else{
    for(let x=0;x<w;x++){
      for(let y=0;y<h;y++){
        let m=255; const a=Math.max(0,y-r), b=Math.min(h-1,y+r);
        for(let k=a;k<=b;k++){ const v=src[k*w+x]; if(v<m) m=v; }
        dst[y*w+x]=m;
      }
    }
  }
}

/* 한 줄씩 상자 흐림. 가장자리는 끝 픽셀을 늘려 쓴다 */
function __binBox1D(src, dst, w, h, r, horiz){
  const n = 2*r+1;
  if(horiz){
    for(let y=0;y<h;y++){
      const row=y*w; let s=0;
      for(let k=-r;k<=r;k++) s += src[row+Math.min(w-1,Math.max(0,k))];
      for(let x=0;x<w;x++){
        dst[row+x]=s/n;
        s += src[row+Math.min(w-1,x+r+1)] - src[row+Math.max(0,x-r)];
      }
    }
  }else{
    for(let x=0;x<w;x++){
      let s=0;
      for(let k=-r;k<=r;k++) s += src[Math.min(h-1,Math.max(0,k))*w+x];
      for(let y=0;y<h;y++){
        dst[y*w+x]=s/n;
        s += src[Math.min(h-1,y+r+1)*w+x] - src[Math.max(0,y-r)*w+x];
      }
    }
  }
}

/* 오츠 방법: 두 무리(글씨/바탕)의 차이가 가장 커지는 기준값 */
function __binOtsu(hist, total){
  let sum=0; for(let t=0;t<256;t++) sum += t*hist[t];
  let sumB=0, wB=0, best=-1, thr=128;
  for(let t=0;t<256;t++){
    wB += hist[t]; if(!wB) continue;
    const wF = total-wB; if(!wF) break;
    sumB += t*hist[t];
    const mB = sumB/wB, mF = (sum-sumB)/wF;
    const v = wB*wF*(mB-mF)*(mB-mF);
    if(v>best){ best=v; thr=t; }
  }
  return thr;
}

/* 히스토그램에서 q(0~1) 위치의 값 */
function __binPct(hist, total, q){
  let acc=0; const goal=total*q;
  for(let t=0;t<256;t++){ acc+=hist[t]; if(acc>=goal) return t; }
  return 255;
}

/* 덩어리 검사: 글씨 획처럼 생기지 않은 덩어리를 지운다.
   mask: 1=검정 후보. dark: 바탕까지 어두운 점(없으면 null). 제자리에서 고친다. */
function __binClean(mask, dark, w, h, thickOnly){
  const N=w*h, m=Math.min(w,h);
  // 획 두께: 가장 가까운 흰 점까지 거리 (체스판 3-4 거리, 3으로 나누면 픽셀)
  const dt = new Uint16Array(N);
  for(let p=0;p<N;p++) dt[p] = mask[p] ? 65535 : 0;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const p=y*w+x; if(!dt[p]) continue;
    let v = dt[p];
    if(x===0||y===0||x===w-1||y===h-1) v = Math.min(v, 3);
    if(x>0) v=Math.min(v, dt[p-1]+3);
    if(y>0){ v=Math.min(v, dt[p-w]+3); if(x>0) v=Math.min(v, dt[p-w-1]+4); if(x<w-1) v=Math.min(v, dt[p-w+1]+4); }
    dt[p]=v;
  }
  for(let y=h-1;y>=0;y--) for(let x=w-1;x>=0;x--){
    const p=y*w+x; if(!dt[p]) continue;
    let v = dt[p];
    if(x<w-1) v=Math.min(v, dt[p+1]+3);
    if(y<h-1){ v=Math.min(v, dt[p+w]+3); if(x<w-1) v=Math.min(v, dt[p+w+1]+4); if(x>0) v=Math.min(v, dt[p+w-1]+4); }
    dt[p]=v;
  }
  // 덩어리 나누기 (8방향으로 이어진 점끼리)
  const lab = new Int32Array(N), stack = new Int32Array(N);
  const minArea = Math.max(4, Math.round(N*0.00012));
  const maxHalf = 0.08*m;           // 이보다 두꺼우면 획이 아니라 덩어리
  const edgeHalf = 0.045*m;         // 가장자리에 붙은 굵은 띠
  let id=0, kept=0;
  for(let s=0;s<N;s++){
    if(!mask[s] || lab[s]) continue;
    id++; let sp=0; stack[sp++]=s; lab[s]=id;
    let area=0, nDark=0, maxD=0, x0=w, x1=-1, y0=h, y1=-1, edge=false;
    const members=[];
    while(sp){
      const p=stack[--sp]; members.push(p); area++;
      const x=p%w, y=(p-x)/w;
      if(dark && dark[p]) nDark++;
      if(dt[p]>maxD) maxD=dt[p];
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
      if(x===0||y===0||x===w-1||y===h-1) edge=true;
      for(let dy=-1;dy<=1;dy++){ const yy=y+dy; if(yy<0||yy>=h) continue;
        for(let dx=-1;dx<=1;dx++){ const xx=x+dx; if(xx<0||xx>=w) continue;
          const q=yy*w+xx; if(mask[q] && !lab[q]){ lab[q]=id; stack[sp++]=q; } } }
    }
    const half = maxD/3, bw=x1-x0+1, bh=y1-y0+1, fill=area/(bw*bh);
    if(thickOnly){                                        // 두꺼운 덩어리만 남기는 모드
      const isThick = half > maxHalf || (area > 0.015*N && fill > 0.75 && half > 0.05*m);
      if(!isThick){ for(const p of members) mask[p]=0; } else kept += area;
      continue;
    }
    let drop =
      area < minArea ||                                   // 티끌
      half > maxHalf ||                                   // 너무 두꺼운 덩어리
      area > 0.35*N ||                                    // 그림의 1/3이 넘는 덩어리
      (nDark > 0.25*area) ||                              // 바탕이 어두운 곳에서 생긴 덩어리
      (area > 0.015*N && fill > 0.75 && half > 0.05*m) ||  // 속이 꽉 찬 큰 덩어리(얼룩)
      (edge && half > edgeHalf && area > 0.12*N) ||       // 가장자리의 굵은 띠
      (edge && ((bw > 0.85*w && bh < 0.08*h) || (bh > 0.85*h && bw < 0.08*w))); // 가장자리의 곧은 선
    if(drop){ for(const p of members) mask[p]=0; }
    else kept += area;
  }
  return kept;
}

/* 캔버스를 제자리에서 흑백으로 바꾼다. 돌려주는 값은 살펴보기용 정보 */
function binarizeCanvas(cv){
  const w = cv.width, h = cv.height, N = w*h;
  const ctx = cv.getContext("2d", {willReadFrequently:true});
  const im = ctx.getImageData(0,0,w,h), d = im.data;

  // ① 회색조와 채도 (투명한 곳은 흰 바탕으로 본다)
  const g = new Float32Array(N), chroma = new Uint8Array(N);
  let twoTone = true;
  for(let i=0,p=0;p<N;i+=4,p++){
    const a = d[i+3]/255;
    const r = d[i]*a+255*(1-a), gg = d[i+1]*a+255*(1-a), b = d[i+2]*a+255*(1-a);
    const v = r*0.299 + gg*0.587 + b*0.114;
    g[p] = v;
    chroma[p] = Math.max(r,gg,b) - Math.min(r,gg,b);
    if(twoTone && !(v<0.5 || v>254.5)) twoTone = false;
  }
  const ink = new Uint8Array(N);
  let info = { threshold:128, contrast:0, ink:0, blank:true };

  if(twoTone){
    // 이미 흑백: 검은 점에 덩어리 검사만
    for(let p=0;p<N;p++) ink[p] = g[p]<0.5 ? 1 : 0;
    const kept = __binClean(ink, null, w, h);
    info = { threshold:128, contrast:255, ink:kept/N, blank:kept/N < 0.002 };
  }else{
    // ② 바탕 밝기
    const s = Math.min(w,h)/224;
    // 닫힘(최댓값 → 최솟값): 가는 획은 지워지고, 그림자·진한 면의 경계는 제자리에 남는다
    const rMax = Math.max(3, Math.round(14*s)), rBox = Math.max(1, Math.round(3*s));
    const t1 = new Float32Array(N), bg = new Float32Array(N);
    __binMax1D(g, t1, w, h, rMax, true);  __binMax1D(t1, bg, w, h, rMax, false);
    __binMin1D(bg, t1, w, h, rMax, true); __binMin1D(t1, bg, w, h, rMax, false);
    __binBox1D(bg, t1, w, h, rBox, true); __binBox1D(t1, bg, w, h, rBox, false);

    // 종이(가장 밝은 바탕) 밝기
    const hb = new Uint32Array(256);
    for(let p=0;p<N;p++) hb[Math.min(255, Math.round(bg[p]))]++;
    const paper = Math.max(1, __binPct(hb, N, 0.95));

    if(paper >= 60){
      // ③ 평평하게 펴기
      const flat = new Uint8Array(N), use = new Uint8Array(N), R = new Uint8Array(N);
      const hist = new Uint32Array(256); let nUse = 0;
      for(let p=0;p<N;p++){
        const v = Math.max(0, Math.min(255, Math.round(g[p]/(bg[p]+1)*255)));
        flat[p] = v;
        const mx = Math.max(1, g[p] + chroma[p]);                // 대략 가장 밝은 색 성분
        const lightColor = chroma[p]/mx > 0.25 && g[p] > 0.35*paper;  // 색이 있고 아주 진하지 않은 것: 인쇄·색 얼룩
        if(!lightColor){ use[p]=1; hist[v]++; nUse++; }
        R[p] = (!lightColor && g[p] < 0.5*paper) ? 1 : 0;          // 아주 어두운 점
      }

      // ④ 기준값과 이력 문턱
      if(nUse > N*0.05){
        const thr = Math.min(__binOtsu(hist, nUse), 225);
        let nB=0, sB=0, sF=0;
        for(let t=0;t<256;t++){ if(t<thr){ nB+=hist[t]; sB+=t*hist[t]; } else sF+=t*hist[t]; }
        const mB = nB ? sB/nB : 255, mF = (nUse-nB) ? sF/(nUse-nB) : 255;
        const contrast = mF - mB;
        const low = mB + (thr - mB)*0.5;       // 시작점이 되려면 이만큼 진해야 한다
        const gCut = 0.65*paper;               // 그리고 종이보다 확실히 어두워야 한다
        info.threshold = thr; info.contrast = Math.round(contrast);
        if(contrast >= 40){
          const stack = new Int32Array(N); let sp = 0;
          for(let p=0;p<N;p++){
            if(use[p] && flat[p] < low && g[p] < gCut){ ink[p]=1; stack[sp++]=p; }
          }
          while(sp){                              // 시작점에서 이어진 획만 키운다
            const p = stack[--sp], x = p%w, y = (p-x)/w;
            for(let dy=-1;dy<=1;dy++){ const yy=y+dy; if(yy<0||yy>=h) continue;
              for(let dx=-1;dx<=1;dx++){ const xx=x+dx; if(xx<0||xx>=w) continue;
                const q=yy*w+xx;
                if(!ink[q] && use[q] && flat[q] < thr){ ink[q]=1; stack[sp++]=q; } } }
          }
          // ⑤ 아주 어두운 점 가운데 두꺼운 덩어리(우유갑 진한 면, 짙은 무늬)는
          //    그 둘레까지 흰색으로, 가는 것(굵은 펜 글씨 속)은 검정으로
          const thick = new Uint8Array(N);
          for(let p=0;p<N;p++) thick[p]=R[p];
          __binClean(thick, null, w, h, true);    // true: 두꺼운 덩어리만 남긴다
          const rd = Math.max(2, Math.round(3*s));
          const near = new Uint8Array(N), tmp = new Uint8Array(N);
          for(let y=0;y<h;y++) for(let x=0;x<w;x++){ let v=0; const a=Math.max(0,x-rd), b=Math.min(w-1,x+rd);
            for(let k=a;k<=b && !v;k++) v=thick[y*w+k]; tmp[y*w+x]=v; }
          for(let x=0;x<w;x++) for(let y=0;y<h;y++){ let v=0; const a=Math.max(0,y-rd), b=Math.min(h-1,y+rd);
            for(let k=a;k<=b && !v;k++) v=tmp[k*w+x]; near[y*w+x]=v; }
          for(let p=0;p<N;p++){
            if(R[p]) ink[p]=1;
            if(near[p]) ink[p]=0;
          }
          // ⑥ 덩어리 검사
          const kept = __binClean(ink, null, w, h);
          info.ink = kept/N; info.blank = kept/N < 0.002;
        }
      }
    }
    if(info.blank) ink.fill(0);
  }

  for(let i=0,p=0;p<N;i+=4,p++){
    const v = ink[p] ? 0 : 255;
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  ctx.putImageData(im,0,0);
  return info;
}


/* ── 전처리 = 흰 정사각형에 담기 + 흑백 이진화(bin-v2 '글씨만 검정') ──
   자른 부분을 224×224 흰 정사각형에 담은 뒤 binarizeCanvas() 로
   펜 글씨 획만 검정, 어두운 배경·얼룩·그림자·색 인쇄는 흰색으로 보낸다.
   ※ 학생 화면·eval·threshold·occlude·data.html 이 모두 이 순서를 그대로 쓴다.
      한 곳이라도 다르면 학습·평가·실전의 입력이 어긋나 숫자를 견줄 수 없다. */
function preprocess(src, sx, sy, sw, sh, outCanvas){
  const out = fitSquare(src, sx, sy, sw, sh, outCanvas);
  out.__bin = binarizeCanvas(out, {rect: out.__rect});
  return out;
}

/* 전처리 켜짐/꺼짐에 따라 모델에 넣을 캔버스를 만든다 */
function makeInput(src, usePrep, outCanvas){
  const w = src.naturalWidth || src.width, h = src.naturalHeight || src.height;
  return usePrep ? preprocess(src, 0, 0, w, h, outCanvas)
                 : fitSquare(src, 0, 0, w, h, outCanvas);
}

/* ── 파일 이름에서 정답 클래스 읽기 ─────────────────────────────
   첫 밑줄 앞부분. 예) can_01.jpg → can, 아두_03.png → 아두
   폴더째 넣은 경우에는 상위 폴더 이름을 먼저 본다. */
function labelFromFile(file){
  const path = file.webkitRelativePath || "";
  if(path.indexOf("/") >= 0){
    const parts = path.split("/");
    if(parts.length >= 2) return parts[parts.length-2].trim();
  }
  const stem = file.name.replace(/\.[^.]+$/, "");
  const i = stem.indexOf("_");
  return (i > 0 ? stem.slice(0,i) : stem).trim();
}

/* 파일 하나를 이미지로 읽기 */
function readImage(file){
  return new Promise((res, rej)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error(file.name + " 를 열 수 없습니다")); };
    img.src = url;
  });
}

/* 가장 확률이 높은 클래스 고르기 */
function topOf(pred){ return pred.reduce((a,b)=> a.probability > b.probability ? a : b); }

/* ── 내려받기 ──────────────────────────────────────────────────── */
function downloadBlob(blob, filename){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
/* 엑셀·한글에서 한글이 깨지지 않도록 BOM 을 앞에 붙인다 */
function downloadCsv(rows, filename){
  const q = v => '"' + String(v).replace(/"/g,'""') + '"';
  const body = rows.map(r => Array.isArray(r) ? r.map(q).join(",") : r).join("\r\n");
  downloadBlob(new Blob(["﻿"+body], {type:"text/csv;charset=utf-8;"}), filename);
}
function stamp(){ return new Date().toISOString().slice(0,10); }

/* 캔버스를 PNG 로 저장 */
function downloadCanvas(canvas, filename){
  canvas.toBlob(b => downloadBlob(b, filename), "image/png");
}

  clearMsg("camMsg");
  try{
    dvStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:facing} }, audio:false });
    const v = $("dvVideo");
    v.srcObject = dvStream; await v.play();
    $("dvWrap").classList.remove("hidden");
    $("btnSnap").disabled = false; $("btnStop").disabled = false;
    const track = dvStream.getVideoTracks()[0];
    const s = track.getSettings ? track.getSettings() : {};
    msg("camMsg","카메라가 켜졌습니다. " + (s.width ? ("해상도 "+s.width+"×"+s.height) : ""), "ok");
  }catch(e){
    msg("camMsg","카메라를 켜지 못했습니다. <b>"+esc(e.name||"오류")+"</b><br>" +
      "권한을 거부했거나, http 주소이거나, 다른 앱이 카메라를 쓰고 있을 수 있습니다.","err");
  }
}
function stopCam(){
  if(dvStream){ dvStream.getTracks().forEach(t=>t.stop()); dvStream = null; }
  const v = $("dvVideo"); if(v) v.srcObject = null;
  $("btnSnap").disabled = true; $("btnStop").disabled = true;
  $("dvWrap").classList.add("hidden");
}
function snap(){
  const v = $("dvVideo"); if(!v.videoWidth) return;
  const c = document.createElement("canvas");
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v,0,0);
  const img = $("dvShot");
  img.src = c.toDataURL("image/jpeg", 0.85);
  img.classList.remove("hidden");
  msg("camMsg","한 장 찍었습니다. 글씨가 또렷하게 보이는지 확인하세요. (사진은 저장되지 않습니다)","ok");
}

/* 결과 복사 */
function copyAll(){
  const lines = ["[교실 기기 점검] " + new Date().toLocaleString("ko-KR")];
  lines.push("주소: " + location.href);
  results.forEach(r => lines.push("- " + r.title + ": " +
    ({ok:"정상", no:"문제", warn:"주의"}[r.state]) + " (" + r.value + ")"));
  lines.push("- 기기/브라우저: " + navigator.userAgent);
  const text = lines.join("\n");
  navigator.clipboard.writeText(text)
    .then(()=> msg("copyMsg","복사했습니다. 기록표에 붙여 넣으세요.","ok"))
    .catch(()=> msg("copyMsg","복사가 막혔습니다. 아래 표를 직접 긁어서 복사하세요.","warn"));
}

$("btnRe").onclick = checkAll;
$("btnBack").onclick = ()=> openCam("environment");
$("btnFront").onclick = ()=> openCam("user");
$("btnSnap").onclick = snap;
$("btnStop").onclick = stopCam;
$("btnCopy").onclick = copyAll;
checkAll();

</script>
</body>
</html>
